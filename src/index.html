<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shortcut Repro</title>
  </head>
  <body>
    <h1>Tauri macOS shortcut repro</h1>

    <p>
      Select some text in the field below, then press
      <kbd>Cmd</kbd>+<kbd>C</kbd>, <kbd>Cmd</kbd>+<kbd>X</kbd>,
      <kbd>Cmd</kbd>+<kbd>V</kbd>, <kbd>Cmd</kbd>+<kbd>A</kbd>, or
      <kbd>Cmd</kbd>+<kbd>Z</kbd>.
    </p>

    <input type="text" size="40" placeholder="Type here" />
    <br /><br />
    <textarea rows="6" cols="50">Type here, then try the shortcuts above.</textarea>
  </body>
</html>
